 que você confere antes de liberar essa prescrição para manipulação?"},{id:10,type:"four-cards-grid",title:"Validação Farmacêutica em 4 Dimensões",subtitle:"O checklist sistemático de segurança antes da manipulação",columns:[{icon:"UserCheck",category:"Paciente",color:"blue",items:["Identificação","Peso atualizado","Altura conferida","Superfície Corpórea (SC)","Histórico de alergias"]},{icon:"FileText",category:"Protocolo",color:"teal",items:["Diagnóstico oncológico","Esquema padronizado","Número do Ciclo atual","Intervalo entre ciclos","Critérios de inclusão"]},{icon:"Pill",category:"Medicamento",color:"indigo",items:["Dose calculada","Via de administração","Diluente e volume","Estabilidade físico-química","Ordem cronológica de infusão"]},{icon:"ShieldAlert",category:"Segurança",color:"emerald",items:["Hemograma recente","Função renal e hepática","Grau de toxicidades prévias","Interações medicamentosas","Dose cumulativa (Antraciclinas)"]}]},{id:11,type:"warning-banner",title:"“A conta está certa?”",mainAlert:"Dose correta ≠ Tratamento necessariamente seguro",description:"A validação farmacêutica vai muito além do cálculo matemático da dose por m².",equation:"Paciente + Doença + Protocolo + Medicamento + Dose + Momento + Condições Clínicas Atuais"},{id:12,type:"case-followup",caseNumber:1,title:"Três Semanas Depois...",subtitle:"Retorno para avaliação do 2º ciclo de tratamento",patient:"Maria, 58 anos (após o 1º ciclo de AC)",complaint:"“Estou muito enjoada depois da quimioterapia.”",otherSymptoms:["Constipação intestinal persistente","Fadiga acentuada (cansaço extremo)","Grande dificuldade para manter a alimentação e hidratação"],question:"O que o farmacêutico clínico precisa investigar imediatamente?"},{id:13,type:"investigation-checklist",title:"Manejo de Náusea e Vômito (NVIQ)",subtitle:"Roteiro de investigação clínica antiemética",checks:[{question:"Profilaxia adequada?",desc:"O paciente recebeu o protocolo antiemético correto para o potencial emetogênico do es  ➔ Descarte à direita",'Respeitar a "Zona Crítica": ar estéril do HEPA direto na agulha e ponto de infusão',"Manter materiais a pelo menos 10 a 15 cm das bordas e grelhas da cabine"]},{category:"Técnica & Pressão Negativa",icon:"Syringe",tag:"Farmacotécnica",items:["Desinfecção prévia com álcool 70% estéril e gaze que não libere partículas","Ajuste pressão negativa nos frascos para evitar aerossóis e vazamentos","Proibido ejetar ar com resíduos ou borrifar qualquer solução na cabine"]},{category:"Biossegurança & EPIs",icon:"ShieldCheck",tag:"Segurança da Equipe",items:["Dois pares de luvas estéreis e sem talco (uma sob e outra sobre o punho do avental)","Troca de luvas a cada 1 hora ou imediatamente em caso de perfuração ou contaminação","Avental impermeável com punho elástico e fechamento posterior + máscara PFF2/N95","Descarte imediato de perfurocortantes em coletor rígido químico dentro da cabine"]}],goldenRule:" Regra de Ouro: A Cabine de Segurança Biológica não compensa falhas técnicas. Movimentos bruscos, excesso de materiais ou bloqueio de grelhas quebram a barreira de ar e expõem o manipulador e o medicamento a contaminação."},{id:18,type:"safety-matrix",title:"Segurança do Paciente em Oncologia",corePrinciple:"Os 5 Certos Ampliados: Paciente certo, Medicamento certo, Dose certa, Via certa e Horário certo. Em oncologia: “O tratamento certo para o paciente certo no momento certo.”",sectionTitle:"Erros e riscos graves que a atuação farmacêutica sistemática evita:",errors:[{name:"Erro de Paciente",desc:"Homônimos e identificação incorreta"},{name:"Erro de Medicamento",desc:"Troca de nomes semelhantes (LASA)"},{name:"Erro de Dose",desc:"Cálculo de superfície corpórea incorreto"},{name:"Erro de Via",desc:"Vias inadvertidas (ex: Vincristina intratecal)"},{name:"Erro de Programação",desc:"Taxas e tempos de bomba de infusão"},{name:"Interações Graves",desc:"Indução ou inibição enzimática crítica"},{name:"Toxicidade Evitável",desc:"Dose cumulativa não monitorada"},{n ,title:"CASO 2 — O Tratamento em Casa",subtitle:"A quimioterapia antineoplásica por via oral",patient:{name:"João",age:"71 anos",diagnosis:"Câncer Colorretal",context:"Inicia tratamento com protocolo CAPOX (Capecitabina oral + Oxaliplatina IV)."},medicalReport:"Protocolo: Oxaliplatina IV no D1 + Capecitabina oral 1000 mg/m² 2x/dia do D1 ao D14 (ciclos de 21 dias).",question:"Quais os cuidados essenciais e orientações farmacêuticas antes de iniciar o tratamento em domicílio?"},{id:23,type:"challenge",title:"Terapia Antineoplásica Oral",subtitle:"A transferência do cuidado para o ambiente doméstico",highlights:[{icon:"Home",title:"Administração Domiciliar",text:"No protocolo CAPOX, a Capecitabina é autoadministrada pelo paciente ou cuidador na sua residência por 14 dias seguidos."},{icon:"UserX",title:"Ausência da Equipe à Beira-Leito",text:"Não existe um profissional de saúde ao lado do paciente durante as tomadas para checar horários, náuseas ou toxicidades."}],summaryBox:{title:"A Mudança de Paradigma",text:"“Agora não existe mais a equipe ao lado do paciente durante a administração. O paciente se torna o gestor do seu próprio tratamento antineoplásico.”"}},{id:24,type:"education-pillars",title:"O Paciente em Casa: O Que Ele Precisa Saber?",subtitle:"Pilares fundamentais da orientação farmacêutica para antineoplásicos orais",pillars:[{title:"Como Tomar Corretamente",icon:"Clock",items:["Dose exata prescrita","Horários fixos (a cada 12 horas)","Ingerir até 30 min após as refeições com água","O que fazer exatamente em caso de esquecimento"]},{title:"Armazenamento & Manuseio",icon:"ShieldCheck",items:["Manter em local seco, fresco e fora do alcance de crianças","Não partir, abrir ou mastigar os comprimidos","Lavar as mãos antes e após o manuseio"]},{title:"O Que Evitar & Cuidados",icon:"AlertTriangle",items:["Não usar medicamentos ou fitoterápicos sem consulta prévia","Cuidado com antiácidos com hidróxido de alumínio/magnésio","Evitar bebidas alcoólicas e automedicaçã idas"},{name:"Crenças & Medos",desc:"Receio infundado de dependência ou efeitos irreversíveis"},{name:"Depressão & Isolamento",desc:"Impacto na motivação e autocuidado"},{name:"Ausência de Sintomas",desc:"Falsa sensação de que o remédio não é mais necessário"}],goldenRule:"“O farmacêutico precisa perguntar ativamente e com empatia, e nunca presumir que o paciente está tomando corretamente.”"},{id:27,type:"health-education",title:"Comunicação e Educação em Saúde Eficaz",subtitle:"As 5 perguntas essenciais que toda orientação farmacêutica deve responder",steps:[{num:"1",question:"O que devo fazer?",desc:"Nome do fármaco, finalidade clara e dose exata prescrita."},{num:"2",question:"Como devo fazer?",desc:"Modo de tomar, relação com alimentos, armazenamento e horários."},{num:"3",question:"Por que isso é importante?",desc:"A relevância clínica da adesão e da pontualidade para combater as células tumorais."},{num:"4",question:"O que pode acontecer?",desc:"Efeitos colaterais previsíveis e estratégias preventivas de manejo."},{num:"5",question:"Quando devo procurar ajuda?",desc:"Sinais de alerta vermelhos e canais de contato de emergência com o hospital."}]},{id:28,type:"case-study-intro",caseNumber:3,title:"CASO 3 — O Paciente Complexo",subtitle:"Polifarmácia crítica e fragilidade clínica",patient:{name:"Antônio",age:"72 anos",diagnosis:"Câncer de Pulmão de Células Não Pequenas Avançado",context:"Iniciará quimioterapia sistêmica combinada com imunoterapia."},medicationsList:["Losartana 50 mg (Anti-hipertensivo)","Metformina 850 mg (Hipoglicemiante oral)","Varfarina / DOAC (Anticoagulante para fibrilação atrial)","Sertralina 50 mg (Antidepressivo)","Tramadol / Dipirona (Analgesia oncológica)","Lactulose (Laxativo osmótico)","Metoclopramida (Antiemético pró-cinético)"],evolution:"Semanas após início do tratamento antineoplásico: Apresenta fadiga severa (grau 3), diarreia persistente, anorexia marcada e alteração relevante de exames renais e hepáticos."},{id:29,type:"multidisciplinary",title:"“Quem Cuida Desse Paciente?”",subtitle:"O modelo de assistência integrada e multiprofissional",question:"A responsabilidade pelo sucesso terapêutico é apenas do médico ou apenas do farmacêutico?",answer:"NÃO. A oncologia exige uma rede multiprofissional coordenada e centrada na pessoa.",team:[{role:"Médico Oncologista",icon:"Stethoscope"},{role:"Farmacêutico Clínico",icon:"Pill"},{role:"Enfermagem Oncológica",icon:"HeartPulse"},{role:"Nutrição Clínica",icon:"Apple"},{role:"Psicologia",icon:"Smile"},{role:"Fisioterapia",icon:"Activity"},{role:"Odontologia",icon:"Sparkles"},{role:"Serviço Social",icon:"Users"}]},{id:30,type:"interdisciplinary-actions",title:"Atuação Farmacêutica Multiprofissional",subtitle:"Ações concretas no round clínico e ambulatório",actions:[{title:"Identificação Precoce de PRMs",desc:"Detectar problemas relacionados a medicamentos e sugerir intervenções precisas aos prescritores."},{title:"Manejo Profilático de Toxicidades",desc:"Auxiliar na otimização de terapias de suporte para náuseas, mucosite, diarreia e dor."},{title:"Avaliação Avançada de Interações",desc:"Identificar sinergismos tóxicos entre terapia oncológica e comorbidades crônicas."},{title:"Seguimento & Adesão Terapêutica",desc:"Acompanhar o uso correto de antineoplásicos orais e documentar desfechos clínicos."},{title:"Registro em Prontuário Eletrônico",desc:"Garantir comunicação clara, rastreável e interprofissional entre todos os membros da equipe."}],competenceNote:"⚠️ Limite de Competência: O farmacêutico precisa reconhecer prontamente quando o quadro clínico ultrapassa seu escopo e exige encaminhamento médico imediato."},{id:31,type:"interactions-deepdive",title:"Interações Medicamentosas em Oncologia",subtitle:"Desmistificando o julgamento clínico e a conduta farmacêutica",question:"Interação medicamentosa significa necessariamente que dois fármacos NÃO podem ser administrados juntos?",verdict:"NÃO.",pillars:[{title:"Farmacocinética",desc:"Alterações em ab
